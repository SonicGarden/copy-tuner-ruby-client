<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CopyTuner Dev</title>
  <style>
    .fixed-banner {
      position: fixed;
      top: 0;
      right: 0;
      padding: 8px 12px;
      background: #ffe9a8;
    }

    .spacer {
      height: 150vh;
    }
  </style>
</head>

<body>
  <div id="app">
    <ul>
      <li data-copyray-key="projects.index.locales">言語</li>
      <li data-copyray-key="projects.index.blurbs">翻訳キー</li>
      <li data-copyray-key="projects.index.members">メンバー数</li>
    </ul>

    <p class="fixed-banner" data-copyray-key="projects.index.fixed_banner">固定表示のバナー</p>

    <button type="button" id="open-app-modal">アプリのモーダルを開く</button>

    <dialog id="app-modal">
      <p data-copyray-key="projects.index.modal_body">モーダル内の文言</p>
      <button type="button" id="close-app-modal">閉じる</button>
    </dialog>

    <div class="spacer"></div>

    <p data-copyray-key="projects.index.below_spacer">スクロール後に見える文言</p>
  </div>
  <script>
    window.CopyTuner = {
      url: 'https://copy-tuner.herokuapp.com/projects/xxx',
      data: {
        'projects.index.locales': '言語',
        'projects.index.blurbs': '翻訳キー',
        'projects.index.members': 'メンバー数',
        'projects.index.fixed_banner': '固定表示のバナー',
        'projects.index.modal_body': 'モーダル内の文言',
        'projects.index.below_spacer': 'スクロール後に見える文言',
      },
    }

    const appModal = document.getElementById('app-modal')
    document.getElementById('open-app-modal').addEventListener('click', () => appModal.showModal())
    document.getElementById('close-app-modal').addEventListener('click', () => appModal.close())
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
